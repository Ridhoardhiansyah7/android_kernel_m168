name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig name (e.g., a3core_eur_open_defconfig)'
        required: true
        default: 'a3core_eur_open_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      KERNEL_ROOT: ${{ github.workspace }}
      BSP_BUILD_DT_OVERLAY: "y"
      BSP_BUILD_ANDROID_OS: "y"
      BSP_BUILD_FAMILY: "sharkl3"
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"
      CC: "clang"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ python3 libncurses-dev flex bison ccache \
            device-tree-compiler lz4 xz-utils zip zlib1g-dev

      - name: Setup Toolchains (GCC 14.3 + Clang)
        run: |
          mkdir -p toolchains/clang-r383902b toolchains/gcc-14.3

          # Download Clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang-r383902b && rm clang.tar.gz

          # Download GCC 14.3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchains/gcc-14.3 --strip-components=1 && rm gcc.tar.xz

          chmod +x toolchains/clang-r383902b/bin/* toolchains/gcc-14.3/bin/*

          echo "${{ github.workspace }}/toolchains/clang-r383902b/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/toolchains/gcc-14.3/bin" >> $GITHUB_PATH

          # Setup ccache
          ccache -M 5G
          ccache -z

      - name: Configure kernel
        run: |
          make -C $KERNEL_ROOT O=$KERNEL_ROOT/out ARCH=$ARCH ${{ inputs.defconfig }} || exit 1

      - name: Build kernel + DTBs + DTBOs
        run: |
          make -C $KERNEL_ROOT \
            O=$KERNEL_ROOT/out \
            -j$(nproc) \
            ARCH=$ARCH \
            CC=$CC \
            LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            BSP_BUILD_DT_OVERLAY=$BSP_BUILD_DT_OVERLAY \
            BSP_BUILD_ANDROID_OS=$BSP_BUILD_ANDROID_OS \
            BSP_BUILD_FAMILY=$BSP_BUILD_FAMILY \
            Image dtbs dtbo || exit 1

      - name: Package DTBs and DTBOs
        run: |
          mkdir -p $KERNEL_ROOT/build/dtb
          DTB_DIR=$KERNEL_ROOT/out/arch/arm64/boot/dts
          if [ -d "$DTB_DIR" ]; then
            find "$DTB_DIR" -name "*.dtb" -exec cp {} $KERNEL_ROOT/build/dtb/ \;
            find "$DTB_DIR" -name "*.dtbo" -exec cp {} $KERNEL_ROOT/build/dtb/ \;
          fi

      - name: Copy Kernel Image
        run: |
          cp $KERNEL_ROOT/out/arch/arm64/boot/Image $KERNEL_ROOT/build/Image

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_id }}
          path: $KERNEL_ROOT/build/*
          retention-days: 7