name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig name'
        required: true
        default: 'a3core_eur_open_defconfig'
      isPermissive:
        description: 'check this option to force permissive kernel'
        required: true
        type: boolean
        default: false
      isRepackToBootImage:
        description: 'check this option to repack boot.img'
        required: true
        type: boolean
        default: true
         

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      KERNEL_ROOT: ${{ github.workspace }}
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"
      CC: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc g++ python3 libncurses-dev flex bison ccache \
            libssl-dev libelf-dev libyaml-dev wget tar

      - name: Setup GCC 14.3 & Clang
        run: |
          mkdir -p toolchains/gcc-14.3 toolchains/clang-r383902b

          # Download Clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang-r383902b && rm clang.tar.gz

          # Download GCC 14.3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchains/gcc-14.3 --strip-components=1 && rm gcc.tar.xz

          echo "${{ github.workspace }}/toolchains/clang-r383902b/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/toolchains/gcc-14.3/bin" >> $GITHUB_PATH

      - name: Configure kernel
        run: |
          make -C $KERNEL_ROOT O=$KERNEL_ROOT/out ARCH=$ARCH ${{ inputs.defconfig }}

      - name: Patch permissive
        if: "${{ inputs.isPermissive == true }}"
        run: |
          # patch selinuxfs and hooks to force permissive
          TARGET_BRANCH="KernelSU-permissive"
          git fetch --depth 1 origin $TARGET_BRANCH
          
          git checkout FETCH_HEAD -- security/selinux/hooks.c
          git checkout FETCH_HEAD -- security/selinux/selinuxfs.c
          
          echo "Patch successfuly from $TARGET_BRANCH branch"
          
      - name: Build kernel
        run: |

          # Build metadata
          export KBUILD_BUILD_HOST="$(. /etc/os-release && echo ${NAME}-${VERSION_ID})"
          export KBUILD_BUILD_TIMESTAMP="$(date '+%a %b %d %T WIB %Y')"
        
          # ignore yaml
          sed -i '/yamltree.o/d' scripts/dtc/Makefile
          sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c

          make -C $KERNEL_ROOT O=$KERNEL_ROOT/out -j$(nproc) \
            ARCH=$ARCH CC=$CC CROSS_COMPILE=$CROSS_COMPILE Image

      - name: Build into boot.img
        if: "${{ inputs.isRepackToBootImage == true }}"
        run: |
          echo "Downloading Magisk..."
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          
          echo "Extracting magiskboot..."
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          if [ ! -f "boot.img" ]; then
            echo "Error: prebuild boot.img not found in this repository!"
            exit 1
          fi

          echo "Unpacking stock boot.img..."
          ./magiskboot unpack boot.img
          
          echo "Replacing kernel..."
          cp ${{ github.workspace }}/out/arch/arm64/boot/Image kernel
          
          echo "Repacking into new-boot.img..."
          ./magiskboot repack boot.img result_boot.img
          
          echo "Done!"

      - name: Upload Boot Image
        if: "${{ inputs.isRepackToBootImage == true }}"
        uses: actions/upload-artifact@v4
        with:
          name: boot-image-patched
          path: result_boot.img 
          retention-days: 7

      - name: Upload Kernel Image
        if: "${{ inputs.isRepackToBootImage == false }}"      
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          retention-days: 7
