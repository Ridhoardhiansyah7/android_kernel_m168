name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig name'
        required: true
        default: 'a3core_eur_open_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      KERNEL_ROOT: ${{ github.workspace }}
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"
      CC: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc g++ python3 libncurses-dev flex bison ccache \
            libssl-dev libelf-dev libyaml-dev wget tar

      - name: Setup GCC 14.3 & Clang
        run: |
          mkdir -p toolchains/gcc-14.3 toolchains/clang-r383902b

          # Download Clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang-r383902b && rm clang.tar.gz

          # Download GCC 14.3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchains/gcc-14.3 --strip-components=1 && rm gcc.tar.xz

          echo "${{ github.workspace }}/toolchains/clang-r383902b/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/toolchains/gcc-14.3/bin" >> $GITHUB_PATH

      - name: Configure kernel
        run: |
          make -C $KERNEL_ROOT O=$KERNEL_ROOT/out ARCH=$ARCH ${{ inputs.defconfig }}

      - name: Build kernel Image only
        run: |

          # Build metadata
          export KBUILD_BUILD_HOST="$(. /etc/os-release && echo ${NAME}-${VERSION_ID})"
          export KBUILD_BUILD_TIMESTAMP="$(date '+%a %b %d %T WIB %Y')"
        
          # ignore yaml
          sed -i '/yamltree.o/d' scripts/dtc/Makefile
          sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c

          make -C $KERNEL_ROOT O=$KERNEL_ROOT/out -j$(nproc) \
            ARCH=$ARCH CC=$CC CROSS_COMPILE=$CROSS_COMPILE Image

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          retention-days: 7